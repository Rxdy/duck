server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Derrière Traefik on ne connaît ni le schéma ni le port publics : redirections relatives.
    absolute_redirect off;

    # Attention : un add_header dans un location REMPLACE ceux du niveau au-dessus. Les en-têtes de sécurité sont donc
    # répétés dans chaque location (vérifié par scripts/tester-images.sh).

    # Fichiers générés par Vite : le nom contient un hash, cache long. Un fichier absent est une vraie 404
    # (pas la page d'accueil), sinon une erreur de chargement de script serait masquée.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Application : toute adresse inconnue (/jouer, /classement…) retombe sur index.html, le routeur du navigateur
    # (mode historique) prend le relais. Le HTML est toujours revalidé : une mise à jour est vue tout de suite.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;
}
