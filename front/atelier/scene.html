<!doctype html>
<!-- Rend une image de fond : /atelier/scene.html?edition=noel-2026&page=accueil&device=paysage&t=2.5
     Sert à fabriquer public/scenes/<édition>/*.jpg (scripts/render-scenes.mjs) — pas inclus dans le build du jeu. -->
<html lang="fr">
  <body style="margin: 0; background: #0f1218">
    <canvas id="c" style="display: block"></canvas>
    <script type="module">
      import { EDITIONS } from "/src/lib/scenes/calendar.ts";
      import { createStage } from "/src/lib/scenes/stage.ts";

      const q = new URLSearchParams(location.search);
      const edition = EDITIONS.find((e) => e.id === q.get("edition"));
      const layout = edition.layouts.find(
        (l) => l.page === q.get("page") && l.device === q.get("device"),
      );
      const canvas = document.getElementById("c");
      canvas.style.width = `${layout.width}px`;
      canvas.style.height = `${layout.height}px`;
      const stage = createStage(canvas, edition, layout);
      stage.resize(layout.width, layout.height);
      stage.render(Number(q.get("t") ?? 2.5));
      window.__done = true;
    </script>
  </body>
</html>
