<!doctype html>
<!-- Rend une scène de saison pleine page : /atelier/scene.html?scene=noel&w=3200&h=1800&t=2.5
     Sert à fabriquer public/scenes/*.jpg (scripts/render-scenes.mjs) — pas inclus dans le build du jeu. -->
<html lang="fr">
  <body style="margin: 0; background: #0f1218">
    <canvas id="c" style="display: block"></canvas>
    <script type="module">
      import { SCENES } from "/src/lib/scenes/noel.ts";
      import { createStage } from "/src/lib/scenes/stage.ts";

      const q = new URLSearchParams(location.search);
      const definition = SCENES[q.get("scene") ?? "noel"];
      const width = Number(q.get("w") ?? 3200);
      const height = Number(q.get("h") ?? 1800);
      const canvas = document.getElementById("c");
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      const stage = createStage(canvas, definition);
      stage.resize(width, height);
      stage.render(Number(q.get("t") ?? 2.5));
      window.__done = true;
    </script>
  </body>
</html>
