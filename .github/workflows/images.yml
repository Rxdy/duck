# Fusion dans main : vérifications, puis construction et publication des images front et back sur GHCR.
# Le Raspberry Pi (Watchtower, qui suit le tag « latest ») les déploie tout seul en quelques minutes.
name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publier:
    name: Publier ${{ matrix.service }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: front
            context: front
            file: front/Dockerfile
          - service: back
            context: .
            file: back/Dockerfile
    steps:
      - uses: actions/checkout@v4
      # Le Pi est en arm64, le poste de développement en amd64 : les images servent les deux.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rxdy/duck-${{ matrix.service }}:latest
            ghcr.io/rxdy/duck-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
