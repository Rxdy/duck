name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, typecheck, test & build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [front, back]
    # Utilisé uniquement par back (voir back/src/db.test.ts, premier code base
    # de données du projet) : les `services` ne peuvent pas être conditionnés
    # par la matrice, le job front paie juste quelques secondes de démarrage
    # inutilisées.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: duck
          POSTGRES_PASSWORD: duck
          POSTGRES_DB: duck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duck -d duck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      DATABASE_URL: postgres://duck:duck@localhost:5432/duck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present
