name: CI

on:
  # main : la CI est rappelée par images.yml avant de publier (pas de double exécution).
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, typecheck, test & build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [front, back]
    # Utilisé uniquement par back (voir back/src/db.test.ts, premier code base
    # de données du projet) : les `services` ne peuvent pas être conditionnés
    # par la matrice, le job front paie juste quelques secondes de démarrage
    # inutilisées.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: duck
          POSTGRES_PASSWORD: duck
          POSTGRES_DB: duck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duck -d duck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      DATABASE_URL: postgres://duck:duck@localhost:5432/duck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

  # Un seul verdict, sous le nom EXACT que la protection de branche exige.
  #
  # Passer le job en matrice a renommé ses résultats en « … (front) » et
  # « … (back) » : le contexte requis « Lint, typecheck, test & build » n'était
  # plus produit par personne, donc plus jamais satisfait. Les deux jobs
  # pouvaient être verts, la pull request restait bloquée sur l'attente d'un
  # check qui n'arriverait jamais — un verrou sans clé.
  #
  # Ce job agrège. Élargir la matrice (un troisième service, une version de
  # Node) ne redemandera plus de toucher aux réglages de la branche.
  gate:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    needs: lint-test-build
    # `always()` est indispensable : sans lui, un échec de la matrice SAUTE ce
    # job, et un check requis simplement absent laisserait la fusion possible.
    # On veut l'inverse — un échec doit produire un verdict rouge, pas rien.
    if: always()
    steps:
      - name: Verdict
        run: |
          result='${{ needs.lint-test-build.result }}'
          if [ "$result" != "success" ]; then
            echo "front ou back n'est pas vert (${result})." >&2
            exit 1
          fi
          echo "front et back sont verts."

  # Les VRAIES images (nginx, serveur, Postgres) : routage, repli SPA, en-têtes, schéma appliqué au démarrage,
  # contrôle d'origine du WebSocket, arrêt propre. Voir scripts/tester-images.sh.
  images:
    name: Images Docker (build et test)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Construire l'image du front
        uses: docker/build-push-action@v7
        with:
          context: front
          load: true
          tags: duck-front:ci
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front
      - name: Construire l'image du back
        uses: docker/build-push-action@v7
        with:
          context: .
          file: back/Dockerfile
          load: true
          tags: duck-back:ci
          cache-from: type=gha,scope=back
          cache-to: type=gha,mode=max,scope=back
      - name: Servir les images et tester de vraies requêtes
        run: scripts/tester-images.sh duck-front:ci duck-back:ci
