# Un tag vX.Y.Z posé sur main (make release V=X.Y.Z) : on reprend les images déjà construites pour ce commit, sans
# les reconstruire, on leur pose le tag de la version, et on crée la release GitHub.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Le tag est bien sur main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME n'est pas sur main : une version se pose sur ce qui est en production."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le tag est souvent posé juste après la fusion : les images de main peuvent être encore en construction.
      - name: Attendre les images de ce commit
        run: |
          for image in duck-front duck-back; do
            for i in $(seq 1 40); do
              if docker buildx imagetools inspect "ghcr.io/rxdy/$image:$GITHUB_SHA" > /dev/null 2>&1; then break; fi
              if [ "$i" = 40 ]; then
                echo "::error::Aucune image $image pour $GITHUB_SHA. Ce commit n'est pas passé par images.yml : la release ne reconstruit jamais."
                exit 1
              fi
              echo "Image $image $GITHUB_SHA pas encore publiée ($i/40)..."; sleep 30
            done
          done

      - name: Poser le tag de version sur les images
        run: |
          for image in duck-front duck-back; do
            docker buildx imagetools create -t "ghcr.io/rxdy/$image:$GITHUB_REF_NAME" "ghcr.io/rxdy/$image:$GITHUB_SHA"
          done

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
